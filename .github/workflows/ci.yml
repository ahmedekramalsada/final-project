name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final-project-nti/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix . || npm install
      - run: node --check server.js
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=final-project-nti/terraform/infrastructure fmt -check
      - run: terraform -chdir=final-project-nti/terraform/tools fmt -check
